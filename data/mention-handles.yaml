# Mention Handle Registry — Operator-maintained, per-company, per-platform (issue #149, epic #120).
#
# Supersedes the old, LinkedIn-only data/linkedin-handles.yaml (issue #126). Maps a third-party
# company/product's plain name — as it might appear in an Idea brief or a Production Spec's `companies`
# field (e.g. "Anthropic", "1Password") — to that company's handle on one or more platforms. Read via
# the typed store `src/mention-handle/store.ts` (`resolveMentionHandle`, plus the LinkedIn-only
# convenience alias `resolveLinkedInHandle` issue #130's Copy step already calls).
#
# This file is HAND-EDITED by the Operator. It is NOT a live API lookup — OrganicGrowth never queries or
# scrapes any platform for this data (data-handling rule 2: the only two live/Apify jobs in this repo are
# trend-scout's peer-Page scrape and performance-tracker's own-post scrape; this lookup is neither).
#
# Shape: one entry per company, keyed by its plain name; under each, one handle per platform you've
# actually confirmed. Recognized platform keys: linkedin, x, instagram, tiktok, facebook. Only include
# the platforms you've confirmed — an omitted platform key for an otherwise-known company resolves to no
# handle, never a guess. Add an entry once you've confirmed the real handle on that platform itself, e.g.:
#
#   Anthropic:
#     linkedin: anthropic
#     x: AnthropicAI
#   1Password:
#     linkedin: 1password
#
# A company with no entry here — or a platform with no entry under a known company — resolves to no
# handle, never fabricated. Issue #130's LinkedIn Copy variant falls back to plain text and flags it for
# Operator review when that happens; today only the `linkedin` platform is actually woven into composed
# Copy (`src/copy/linkedin-mentions.ts`) — the other platform keys are available through this same store
# for a future Copy variant to use, but composing an @mention for them is out of scope here (issue #149).
#
# Operator-confirmed 2026-08-04 (verified live in Zoho's composer against the real Pages):
OpenAI:
  linkedin: openai
Anthropic:
  linkedin: anthropic
Google:
  linkedin: google
