<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0F16"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- accent bar -->
  <rect x="140" y="300" width="10" height="480" rx="5" fill="#7BF2A8"/>
  <!-- eyebrow -->
  <text x="180" y="250" fill="#6B7280" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="8">STRAW MOTION · UNHYPPED</text>
  <!-- label -->
  <text x="180" y="360" fill="#9CA3AF" font-family="'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="600" letter-spacing="6">PRICE DROP</text>
  <!-- title -->
  <text x="176" y="470" fill="#F5F7FA" font-family="'Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="800">Gemini 3.7 Flash</text>
  <!-- big number -->
  <text x="176" y="700" fill="#7BF2A8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="240" font-weight="800">−50%</text>
  <text x="180" y="770" fill="#F5F7FA" font-family="'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="600">on price</text>
  <!-- subline -->
  <text x="180" y="880" fill="#9CA3AF" font-family="'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="500">Same speed tier · shipped 3 weeks after 3.6</text>
</svg>
